name: Release appelbe

# A pushed vX.Y.Z tag: the GitHub release (the source tarball, the tag's CHANGELOG.md section as the notes,
# scripts/install.sh), by the reusable workflow of fortran-toolchains (https://github.com/szaghi/fortran-toolchains).
# Project-owned (fobos [scaffold] skip): the scaffold's install job is removed because the repository is private, and
# install.sh downloads the release anonymously (404). Once the repository is public, drop the skip and run
# fobis scaffold sync to restore it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:   # from a tag; from a branch the release job does nothing

permissions:
  contents: write

jobs:
  release:
    uses: szaghi/fortran-toolchains/.github/workflows/release.yml@v1
